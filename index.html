      content="Personal portfolio of Santhosh R, a final-year Computer Science student and Java Full-Stack Developer specializing in Spring Boot, React, and PostgreSQL."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

      property="twitter:description"
      content="Personal portfolio of Santhosh R, a final-year Computer Science student and Java Full-Stack Developer specializing in Spring Boot, React, and PostgreSQL."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Dynamic theme-color meta tag -->
    <meta name="theme-color" content="#07090E" id="theme-color-meta" />

    <!-- Theme initialization script (prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = savedTheme ? savedTheme : systemTheme;
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#07090E' : '#F8FAFC');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Hidden static form for Netlify form detection and bot filtering -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
